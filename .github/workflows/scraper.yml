# Save as .github/workflows/mw.yml
name: Malawi jobs scraper

on:
  schedule:
    - cron: "0 5 * * *"      # daily 05:00 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma separated sources"
        required: false
        default: "jobsearchmalawi,careersmw,careeradmw,linkedin"

permissions:
  contents: write

concurrency:
  group: mw-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INTERNAL_BOT_KEY: ${{ secrets.INTERNAL_BOT_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources || 'jobsearchmalawi,careersmw,careeradmw,linkedin' }}
          LINKEDIN_LOCATION: Malawi
          LINKEDIN_TIME_RANGE: r86400
        run: python mw.py

      - name: Commit tracker files (prevents re-posting duplicates)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_jobs.csv flagged_no_apply.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update tracker [skip ci]"
          git pull --rebase || true
          git push || true

      - name: Upload Excel output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs_output
          path: jobs_output.xlsx
          if-no-files-found: ignore
